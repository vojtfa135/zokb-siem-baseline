name: validate

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Validate YAML files against JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          from jsonschema import validate

          root = Path('.')
          schema_map = {
              'logging/event-classes.yaml': 'schema/event-classes.schema.json',
              'logging/event-classes-detection.yaml': 'schema/event-classes.schema.json',
              'logging/required-fields.yaml': 'schema/required-fields.schema.json',
              'profiles/higher.yaml': 'schema/profile.schema.json',
              'profiles/lower.yaml': 'schema/profile.schema.json',
          }
          # Discover source files by glob so new log sources are validated
          # automatically (2-file rule, AGENTS.md).
          for src in sorted((root / 'logging' / 'sources').glob('*.yaml')):
              schema_map[str(src)] = 'schema/source.schema.json'
          # Technology mapping layer is optional (logging/technologies/ may
          # not exist or be empty); validate any files that are present.
          tech_dir = root / 'logging' / 'technologies'
          if tech_dir.is_dir():
              for tech in sorted(tech_dir.glob('*.yaml')):
                  schema_map[str(tech)] = 'schema/technology.schema.json'

          for data_file, schema_file in schema_map.items():
              data = yaml.safe_load((root / data_file).read_text(encoding='utf-8'))
              schema = json.loads((root / schema_file).read_text(encoding='utf-8'))
              validate(instance=data, schema=schema)
              print(f'OK: {data_file}')
          PY

      - name: Coverage checks (must pass)
        run: |
          python tools/coverage_check.py

      - name: Detection rule staleness check (advisory for now)
        # Warn-mode: reports rules past the 365-day review window without
        # failing the build. Switch to `--fail` after the first full review
        # cycle proves the process (see docs/detection-lifecycle.md).
        run: |
          python tools/staleness_check.py

      - name: Install Sigma tooling (best effort)
        continue-on-error: true
        run: |
          pip install sigma-cli pysigma pysigma-backend-splunk pysigma-backend-microsoft365defender

      - name: Sigma lint and conversion (best effort)
        continue-on-error: true
        run: |
          # Lint every rule file, including correlations.
          find detections -name '*.yml' -print0 | while IFS= read -r -d '' f; do
            sigma check "$f"
          done
          sigma convert -t splunk detections/auth/failed-logons-bruteforce.yml > /tmp/splunk-query.txt
          sigma convert -t sentinel detections/network/perimeter-block.yml > /tmp/sentinel-query.txt
