title: Web proxy blocked request
id: 5c6d7e8f-9a0b-4c1d-8e2f-3a4b5c6d7e8f
zokb_rule_id: zokb-net-proxy-blocked-request
status: experimental
description: >-
  Audit baseline for requests denied by the outbound web proxy / secure web
  gateway (blocked URL category, reputation, or policy). Fires on every
  denial and stays informational to honour the false-positive-reduction
  duty (v409-23.2.a); actionable signal comes from the
  zokb-net-repeat-proxy-denials-correlation correlation. Mirrors
  zokb-net-perimeter-block for the proxy's access-decision plane
  (SRC-WEB-PROXY).
author: zokb-siem-baseline
date: 2026-08-05
modified: 2026-08-05
logsource:
  product: any
  category: network
detection:
  selection:
    event.category: network
    event.type|contains: denied
  condition: selection
fields:
  - '@timestamp'
  - event.timezone
  - event.category
  - event.type
  - event.action
  - host.id
  - user.id
  - event.outcome
falsepositives:
  - Expected policy-denied traffic (the majority of hits by design)
level: informational
tags:
  - zokb.v410.par9.1.a
  - zokb.v410.par9.2.b
  - zokb.v409.par22.3.d
  - zokb.v409.par23.2.a
  - attack.t1071
zokb_required_fields:
  - FLD-A
  - FLD-B
  - FLD-C
  - FLD-D
  - FLD-F
