title: OAuth application consent grant or mailbox rule creation
id: 0e035462-278f-4cd5-9055-8f80dfe13205
zokb_rule_id: zokb-cloud-oauth-consent-mailbox-rule
status: experimental
description: >-
  Detects OAuth application consent grants (including admin consent and
  service-principal app-role grants) and creation of mailbox forwarding /
  inbox rules in cloud identity and collaboration platforms. These are the
  canonical 'other security-relevant user activities' targeted by
  v409-22.3.j that the generic privileged-activity baseline reliably misses.
references:
  - https://attack.mitre.org/techniques/T1098/003/
  - https://attack.mitre.org/techniques/T1114/003/
author: zokb-siem-baseline
date: 2026-07-31
modified: 2026-07-31
logsource:
  product: any
  category: iam
detection:
  selection_consent:
    event.category: iam
    event.type:
      - creation
      - change
    event.action|contains:
      - consent to application
      - consent granted
      - oauth consent
      - app role assignment
  selection_mailbox_rule:
    event.category: iam
    event.type:
      - creation
      - change
    event.action|contains:
      - inbox rule
      - forwarding rule
      - new-inboxrule
      - set-mailbox
      - update inbox rules
  condition: 1 of selection_*
fields:
  - '@timestamp'
  - event.timezone
  - event.category
  - event.type
  - event.action
  - host.id
  - user.id
  - user.target.id
  - device.id
  - source.ip
  - event.outcome
falsepositives:
  - Admin-approved third-party app integrations
  - Users creating personal inbox sorting rules (forwarding to external
    domains should still be reviewed)
level: high
tags:
  - zokb.v409.par22.3.j
  - attack.t1098.003
  - attack.t1114.003
zokb_required_fields:
  - FLD-A
  - FLD-B
  - FLD-C
  - FLD-D
  - FLD-E
  - FLD-F