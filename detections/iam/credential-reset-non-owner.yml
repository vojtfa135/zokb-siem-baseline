title: Credential or password reset on an account
id: 7e158ce0-fcbd-43f5-8f00-b4b7bc8c6b2d
zokb_rule_id: zokb-iam-credential-reset-non-owner
status: experimental
description: >-
  High-signal subset of v409-22.3.c: detects password and credential resets.
  Severity must be raised to high when the actor performing the reset is not
  the account owner — Sigma cannot express cross-field comparison, so deploy
  with an SIEM-side filter comparing actor (user.id / user.name) against the
  target account, or route all hits at medium with actor/target in fields.
references:
  - https://attack.mitre.org/techniques/T1098/
author: zokb-siem-baseline
date: 2026-07-31
modified: 2026-07-31
logsource:
  product: any
  category: iam
detection:
  selection:
    event.category: iam
    event.type: change
    event.action|contains:
      - password reset
      - password change
      - credential reset
      - set password
      - change password
  condition: selection
fields:
  - '@timestamp'
  - event.timezone
  - event.category
  - event.type
  - event.action
  - host.id
  - user.id
  - user.target.id
  - device.id
  - source.ip
  - event.outcome
falsepositives:
  - Self-service password resets
  - Help-desk assisted resets (route as known workflow, tune per CMDB)
level: medium
tags:
  - zokb.v409.par22.3.c
  - zokb.v409.par23.2.a
  - attack.t1098
zokb_required_fields:
  - FLD-A
  - FLD-B
  - FLD-C
  - FLD-D
  - FLD-E
  - FLD-F