title: Account creation followed by privilege grant (persistence chain)
id: 050f3e19-2c20-427b-b386-01413cb4889a
zokb_rule_id: zokb-iam-persistence-chain-correlation
status: experimental
description: >-
  Correlates account manipulation (creation) with a subsequent privileged
  group membership change — the persistence pattern of standing up an
  account and immediately granting it rights. Implements the grouping duty
  of v409-23.1.a across event classes B and C.
  Note: group-by operates on user.id as the correlation key; SIEM deployments
  should map it to the *target* account of both events (ECS user.target.id or
  equivalent during onboarding) for precise chaining.
references:
  - https://attack.mitre.org/techniques/T1136/
  - https://attack.mitre.org/techniques/T1098/
author: zokb-siem-baseline
date: 2026-07-31
modified: 2026-07-31
correlation:
  type: temporal_ordered
  rules:
    - 9c2b1059-8910-41b2-9d2e-0a7af9029eb0
    - 78b7131e-77b7-4a62-81ee-3e3406a4ed70
  group-by:
    - user.id
  timespan: 24h
fields:
  - '@timestamp'
  - event.action
  - host.id
  - user.id
  - event.outcome
falsepositives:
  - Standard onboarding workflows creating and enabling accounts
level: high
tags:
  - zokb.v409.par23
  - zokb.v409.par23.1.a
  - attack.t1136
  - attack.t1098
zokb_required_fields:
  - FLD-A
  - FLD-B
  - FLD-C
  - FLD-D
  - FLD-E
  - FLD-F