title: Removable media autorun execution blocked or attempted
id: ee9b7fd8-471f-4d6a-9d95-c553574f3f9d
zokb_rule_id: zokb-host-removable-media-autorun
status: experimental
description: Detects autorun attempts from removable media and related control actions.
author: zokb-siem-baseline
date: 2026-06-09
modified: 2026-07-31
logsource:
  product: any
  category: host
detection:
  selection:
    event.category: host
    event.action|contains: autorun
  condition: selection
fields:
  - '@timestamp'
  - event.timezone
  - event.category
  - event.type
  - event.action
  - host.id
  - user.id
  - event.outcome
falsepositives:
  - Authorized software deployment workflows
level: medium
tags:
  - zokb.v410.par9.1.c
  - zokb.v410.par9.2.b
  - attack.t1091
zokb_required_fields:
  - FLD-A
  - FLD-B
  - FLD-C
  - FLD-D
  - FLD-F
