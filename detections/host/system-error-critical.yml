title: Critical or error message from technical asset
id: 98abce23-ded2-4d4d-96d4-a269316fd489
zokb_rule_id: zokb-host-system-error-critical
status: experimental
description: >-
  Detects critical and error messages emitted by technical assets including
  service crashes, hypervisor faults, device errors and application failures
  that may indicate denial-of-service, data destruction or system compromise.
references:
  - https://attack.mitre.org/techniques/T1499/
  - https://attack.mitre.org/techniques/T1485/
author: zokb-siem-baseline
date: 2026-07-31
modified: 2026-07-31
logsource:
  product: any
  category: host
detection:
  selection:
    event.category:
      - host
      - database
      - web
    event.type: error
  condition: selection
fields:
  - '@timestamp'
  - event.timezone
  - event.category
  - event.type
  - event.action
  - host.id
  - user.id
  - device.id
  - source.ip
  - event.outcome
falsepositives:
  - Expected errors during maintenance windows
  - Known application bugs
level: low
tags:
  - zokb.v409.par22.3.f
  - attack.t1499
  - attack.t1485
zokb_required_fields:
  - FLD-A
  - FLD-B
  - FLD-C
  - FLD-D
  - FLD-E
  - FLD-F
