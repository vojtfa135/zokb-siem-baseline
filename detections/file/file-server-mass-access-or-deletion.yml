title: File server access, deletion, or permission change
id: 7e8f9a0b-1c2d-4e3f-8a4b-5c6d7e8f9a0b
zokb_rule_id: zokb-file-mass-access-or-deletion
status: experimental
description: >-
  Audit baseline for file-level activity on dedicated file/NAS servers
  (SRC-FILE-SERVER): access, upload/download, deletion, and permission
  changes on shared content. Implements EVT-22-3-J ("other user activities
  with security impact") for the file-share plane. A single event is
  routine usage; bursts of access/deletion across many files in a short
  window are escalated by zokb-file-mass-access-or-deletion-correlation
  (ransomware/exfiltration signal).
references:
  - https://attack.mitre.org/techniques/T1486/
  - https://attack.mitre.org/techniques/T1005/
author: zokb-siem-baseline
date: 2026-08-05
modified: 2026-08-05
logsource:
  product: any
  category: file
detection:
  selection:
    event.category: file
    event.type:
      - access
      - deletion
      - change
  condition: selection
fields:
  - '@timestamp'
  - event.timezone
  - event.category
  - event.type
  - event.action
  - host.id
  - user.id
  - source.ip
  - file.path
  - event.outcome
falsepositives:
  - Scheduled backup or sync jobs touching large numbers of files
  - Bulk archival/cleanup performed by an authorized administrator
level: informational
tags:
  - zokb.v409.par22.3.j
  - attack.t1486
  - attack.t1005
zokb_required_fields:
  - FLD-A
  - FLD-B
  - FLD-C
  - FLD-D
  - FLD-E
  - FLD-F
