title: Audit log access, clearing or tampering attempt
id: c7e31a6d-1b1a-4a82-9a0c-0288ffb4f4f9
zokb_rule_id: zokb-audit-log-clearing-tampering
status: experimental
description: >-
  Detects access to, clearing, deletion or modification of audit and security
  event logs across endpoints, directory services, network devices,
  hypervisors, cloud platforms and container orchestrators. Covers log integrity
  obligations under v409-22.5.c.
references:
  - https://attack.mitre.org/techniques/T1070/
  - https://attack.mitre.org/techniques/T1562/002/
author: zokb-siem-baseline
date: 2026-07-31
modified: 2026-07-31
logsource:
  product: any
  category: file
detection:
  selection:
    event.category: file
    event.type:
      - access
      - denied
      - change
      - deletion
    event.action|contains:
      - log
      - audit
      - eventlog
  condition: selection
fields:
  - '@timestamp'
  - event.timezone
  - event.category
  - event.type
  - event.action
  - host.id
  - user.id
  - device.id
  - source.ip
  - event.outcome
falsepositives:
  - Legitimate log archiving or rotation by authorized administrators
level: high
tags:
  - zokb.v409.par22.3.g
  - zokb.v409.par22.3.h
  - zokb.v409.par22.5.c
  - attack.t1070
  - attack.t1562.002
zokb_required_fields:
  - FLD-A
  - FLD-B
  - FLD-C
  - FLD-D
  - FLD-E
  - FLD-F
