      EVT-22-3-J:
        log_sources: [SRC-WINDOWS, SRC-LINUX, SRC-AD-DC, SRC-CLOUD-IDENTITY, SRC-IDENTITY-DIRECTORY, SRC-FILE-SERVER]
        detection_rules: [zokb-cloud-oauth-consent-mailbox-rule, zokb-file-mass-access-or-deletion, zokb-file-mass-access-or-deletion-correlation]
