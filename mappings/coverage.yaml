      EVT-22-3-D:
        log_sources: [SRC-WINDOWS, SRC-LINUX, SRC-FIREWALL, SRC-AD-DC, SRC-VPN, SRC-CLOUD-IDENTITY, SRC-NAC, SRC-IDENTITY-DIRECTORY, SRC-WEB-PROXY, SRC-FILE-SERVER]
        detection_rules: [zokb-auth-failed-logons-bruteforce, zokb-net-proxy-blocked-request]
      EVT-22-3-E:
        log_sources: [SRC-WINDOWS, SRC-LINUX, SRC-EDR, SRC-VIRTUALIZATION, SRC-CLOUD-IAAS, SRC-CONTAINERS]
        detection_rules: [zokb-host-suspicious-service-process]
      EVT-22-3-F:
        log_sources: [SRC-WINDOWS, SRC-LINUX, SRC-FIREWALL, SRC-EDR, SRC-NETDEV, SRC-VIRTUALIZATION]
        detection_rules: [zokb-host-system-error-critical, zokb-host-error-storm-correlation]
      EVT-22-3-G:
        log_sources: [SRC-WINDOWS, SRC-LINUX, SRC-FIREWALL, SRC-VIRTUALIZATION, SRC-CLOUD-IAAS, SRC-CONTAINERS]
        detection_rules: [zokb-audit-log-clearing-tampering]
      EVT-22-3-H:
        log_sources: [SRC-WINDOWS, SRC-LINUX, SRC-FIREWALL, SRC-AD-DC, SRC-VIRTUALIZATION, SRC-CLOUD-IAAS, SRC-CONTAINERS]
        detection_rules: [zokb-audit-log-clearing-tampering]
