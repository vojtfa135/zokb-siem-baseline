    event_classes:
      EVT-DET-PERIMETER:
        log_sources: [SRC-FIREWALL, SRC-VPN, SRC-WAF, SRC-WEB-PROXY]
        detection_rules: [zokb-net-perimeter-block, zokb-net-repeat-perimeter-denials, zokb-net-proxy-blocked-request, zokb-net-repeat-proxy-denials-correlation]
      EVT-DET-MALWARE:
        log_sources: [SRC-WINDOWS, SRC-EDR]
        detection_rules: [zokb-malware-antimalware-detection]
      EVT-DET-AUTORUN:
        log_sources: [SRC-WINDOWS, SRC-EDR]
        detection_rules: [zokb-host-removable-media-autorun]
