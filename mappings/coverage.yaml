        detection_rules: [zokb-auth-failed-logons-bruteforce, zokb-auth-failed-logons-correlation, zokb-auth-successful-logon, zokb-auth-post-bruteforce-success, zokb-auth-multi-source-logon]
      EVT-22-3-B:
        log_sources: [SRC-WINDOWS, SRC-LINUX, SRC-FIREWALL, SRC-AD-DC, SRC-NETDEV, SRC-VIRTUALIZATION, SRC-CLOUD-IDENTITY, SRC-CLOUD-IAAS, SRC-CONTAINERS, SRC-IDENTITY-DIRECTORY, SRC-MAIL-GATEWAY-CLOUD, SRC-MAIL-GATEWAY-ONPREM]
