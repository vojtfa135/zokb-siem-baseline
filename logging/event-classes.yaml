version: 1
event_classes:
  - id: EVT-22-3-A
    ref: v409-22.3.a
    title: Přihlašování a odhlašování účtů včetně neúspěšných pokusů
    ecs:
      event.category: [authentication]
      event.type: [start, end, info]
    ocsf:
      - class_uid: 3002
        class_name: Authentication
    attack: [T1110, T1078]
    outcomes: [success, failure]
    required_fields: [FLD-A, FLD-B, FLD-C, FLD-D, FLD-E, FLD-F]
  - id: EVT-22-3-B
    ref: v409-22.3.b
    title: Privilegované činnosti (provedení i neúspěšné pokusy)
    ecs:
      event.category: [iam, process]
      event.type: [change, info, admin, start, end]
    ocsf:
      - class_uid: 3005
        class_name: User Access Management
    attack: [T1548, T1078]
    outcomes: [success, failure]
    required_fields: [FLD-A, FLD-B, FLD-C, FLD-D, FLD-E, FLD-F]
  - id: EVT-22-3-C
    ref: v409-22.3.c
    title: Manipulace s účty, oprávněními a právy
    ecs:
      event.category: [iam]
      event.type: [creation, change, deletion]
    ocsf:
      - class_uid: 3001
        class_name: Account Change
    attack: [T1098, T1136]
    outcomes: [success, failure]
    required_fields: [FLD-A, FLD-B, FLD-C, FLD-D, FLD-E, FLD-F]
  - id: EVT-22-3-D
    ref: v409-22.3.d
    title: Neprovedení činnosti z důvodu nedostatku oprávnění
    ecs:
      event.category: [authentication, iam, network]
      event.type: [denied]
    ocsf:
      - class_uid: 3002
        class_name: Authentication
    attack: [T1078, T1548]
    outcomes: [failure]
    required_fields: [FLD-A, FLD-B, FLD-C, FLD-D, FLD-E, FLD-F]
  - id: EVT-22-3-E
    ref: v409-22.3.e
    title: Zahájení a ukončení činností technických aktiv
    ecs:
      event.category: [process, host]
      event.type: [start, end]
    ocsf:
      - class_uid: 1007
        class_name: Process Activity
      - class_uid: 6002
        class_name: Application Lifecycle
    attack: [T1543, T1569]
    outcomes: [success, failure]
    required_fields: [FLD-A, FLD-B, FLD-C, FLD-D, FLD-E, FLD-F]
  - id: EVT-22-3-F
    ref: v409-22.3.f
    title: Kritická a chybová hlášení technických aktiv
    ecs:
      # host+error is a documented ECS deviation: ECS pairs `error` only with
      # database/web, but OS/hardware error reports have no conformant category.
      event.category: [host, database, web]
      event.type: [error]
    ocsf:
      - class_uid: 6008
        class_name: Application Error
    attack: [T1499, T1485]
    outcomes: [success, failure]
    required_fields: [FLD-A, FLD-B, FLD-C, FLD-D, FLD-E, FLD-F]
  - id: EVT-22-3-G
    ref: v409-22.3.g
    title: Přístupy k záznamům událostí (včetně neúspěšných)
    ecs:
      event.category: [file]
      event.type: [access, denied]
    ocsf:
      - class_uid: 1008
        class_name: Event Log Activity
    attack: [T1654, T1005]
    outcomes: [success, failure]
    required_fields: [FLD-A, FLD-B, FLD-C, FLD-D, FLD-E, FLD-F]
  - id: EVT-22-3-H
    ref: v409-22.3.h
    title: Manipulace se záznamy událostí (včetně neúspěšných)
    ecs:
      event.category: [file]
      event.type: [change, deletion]
    ocsf:
      - class_uid: 1008
        class_name: Event Log Activity
    attack: [T1070]
    outcomes: [success, failure]
    required_fields: [FLD-A, FLD-B, FLD-C, FLD-D, FLD-E, FLD-F]
  - id: EVT-22-3-I
    ref: v409-22.3.i
    title: Změny nastavení nástrojů pro zaznamenávání událostí
    ecs:
      event.category: [configuration]
      event.type: [change]
    ocsf:
      - class_uid: 1008
        class_name: Event Log Activity
    attack: [T1562]
    outcomes: [success, failure]
    required_fields: [FLD-A, FLD-B, FLD-C, FLD-D, FLD-E, FLD-F]
  - id: EVT-22-3-J
    ref: v409-22.3.j
    title: Další uživatelské činnosti s dopadem na bezpečnost
    ecs:
      # Documented ECS deviation (same pattern as EVT-22-3-F): the legal
      # title covers ANY other security-relevant user activity, which
      # includes file share operations (upload/download/deletion on
      # SRC-FILE-SERVER). ECS's own iam/session categories don't express
      # file operations, so `file` + access/deletion types are added here
      # rather than misusing EVT-22-3-G/H (which are log-record specific).
      event.category: [iam, session, file]
      event.type: [info, change, start, end, access, deletion]
    ocsf:
      - class_uid: 0
        class_name: Base Event
    outcomes: [success, failure]
    required_fields: [FLD-A, FLD-B, FLD-C, FLD-D, FLD-E, FLD-F]
