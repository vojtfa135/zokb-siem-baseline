id: SRC-EDR
title: Endpoint detection and response (EDR) / antimalware platform
transport:
  protocol: https-api
  format: vendor-json
  failure_detection:
    mechanism: connect-source-monitoring
    note: >-
      Loss of flow is detected by monitoring the API-pull job itself: a
      failed poll, an authentication/authorization error, or a growing gap
      between now and the last successfully ingested event timestamp
      triggers an alert within 15 minutes; successful ingestion within the
      next scoring window after remediation confirms auto-recovery
      (v409-22.6 alerting-duty interpretation).
must_emit_event_classes:
  - EVT-22-3-E
  - EVT-22-3-F
  - EVT-22-3-I
  - EVT-DET-MALWARE
  - EVT-DET-AUTORUN
must_emit_fields:
  - FLD-A
  - FLD-B
  - FLD-C
  - FLD-D
  - FLD-E
  - FLD-F
note: >-
  ACSC priority #1. Detections, process/network telemetry, scheduled-task and
  service changes, and tamper/uninstall events (EVT-22-3-I) must be forwarded.
  Preserve stable host.id and detection verdict/outcome.
