id: SRC-WINDOWS
title: Windows servers and workstations
transport:
  protocol: winrm
  format: windows-event-log
must_emit_event_classes:
  - EVT-22-3-A
  - EVT-22-3-B
  - EVT-22-3-C
  - EVT-22-3-D
  - EVT-22-3-E
  - EVT-22-3-F
  - EVT-22-3-I
  - EVT-22-3-J
  - EVT-DET-MALWARE
  - EVT-DET-AUTORUN
must_emit_fields:
  - FLD-A
  - FLD-B
  - FLD-C
  - FLD-D
  - FLD-E
  - FLD-F
note: Prefer host.id and user.id as stable identifiers; include source.device.id where available.
