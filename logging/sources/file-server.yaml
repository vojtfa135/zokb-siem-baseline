id: SRC-FILE-SERVER
title: File and NAS servers (SMB/NFS/FTP/SFTP) -- Synology, NetApp, QNAP, dedicated file shares
transport:
  protocol: syslog-tls
  format: rfc5424
  failure_detection:
    mechanism: silence-scored-alert
    note: >-
      Loss of flow is detected SIEM-side by silence scoring (no events from the
      source within the scoring window). SIEM rules MUST alert within 15 minutes
      of the last received event and confirm auto-recovery within the next window
      after remediation (v409-22.6 alerting-duty interpretation).
must_emit_event_classes:
  - EVT-22-3-A
  - EVT-22-3-D
  - EVT-22-3-J
must_emit_fields:
  - FLD-A
  - FLD-B
  - FLD-C
  - FLD-D
  - FLD-E
  - FLD-F
note: >-
  Dedicated file-sharing appliances and servers outside the AD/Windows-Server
  share estate (Synology/QNAP NAS, NetApp, standalone SMB/NFS/FTP/SFTP
  servers). Event-plane scoping: this source is the FILE-SHARE/USER plane --
  user logons to the share/FTP service (EVT-22-3-A), access denials
  (EVT-22-3-D), and file-level activity such as upload, download, deletion,
  and permission changes on shared content (EVT-22-3-J -- "other user
  activities with security impact"; see the documented ECS deviation on
  EVT-22-3-J covering file access/deletion). Administrative logons to the
  appliance's own management UI/SSH belong to SRC-NETDEV or SRC-LINUX,
  whichever already owns that host -- do not duplicate. Windows-native file
  shares already covered by SRC-WINDOWS/SRC-AD-DC (events 4663/5140/5145)
  are out of scope here to avoid double-counting.
