id: SRC-MAIL-GATEWAY-CLOUD
title: Cloud mail gateway / email security (Exchange Online Protection, Proofpoint, Mimecast)
transport:
  protocol: https-api
  format: vendor-json
  failure_detection:
    mechanism: connect-source-monitoring
    note: >-
      Loss of flow is detected by monitoring the API-pull job itself: a
      failed poll, an authentication/authorization error, or a growing gap
      between now and the last successfully ingested event timestamp
      triggers an alert within 15 minutes; successful ingestion within the
      next scoring window after remediation confirms auto-recovery
      (v409-22.6 alerting-duty interpretation).
must_emit_event_classes:
  - EVT-22-3-B
  - EVT-22-3-C
  - EVT-22-3-I
must_emit_fields:
  - FLD-A
  - FLD-B
  - FLD-C
  - FLD-D
  - FLD-E
  - FLD-F
note: >-
  Cloud-hosted email security layer (M365 Defender for Office/EOP,
  Proofpoint, Mimecast) pulled over vendor APIs. Event-plane scoping: this
  source carries the SERVICE plane of the mail-security product -- admin
  and privileged actions inside the tenant such as quarantine release or
  override and allow/block-list edits (EVT-22-3-B), transport/mail-flow
  rule and policy manipulation (EVT-22-3-C), and changes to audit/logging
  configuration of the mail-security product itself (EVT-22-3-I).
  Administrator sign-ins to the cloud console are the IdP's concern and
  belong to SRC-CLOUD-IDENTITY (EVT-22-3-A there), not here -- do not
  duplicate. Per-message spam/malware verdicts are valuable context but are
  not a standalone §22(3) class; forward them where volume allows. Preserve
  the tenant id (FLD-C), the acting admin identity (FLD-D), and the client
  IP of the admin action (FLD-E).
