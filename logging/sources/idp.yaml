id: SRC-IDP
title: Identity provider (Entra ID / Okta)
auth_scope: cloud
transport:
  protocol: https-api
  format: json
must_emit_event_classes:
  - EVT-22-3-A   # logon/logoff incl. failures        §22(3)(a)
  - EVT-22-3-B   # privileged activity                §22(3)(b)
  - EVT-22-3-C   # account/permission manipulation     §22(3)(c)
  - EVT-22-3-D   # denied due to insufficient rights    §22(3)(d)
must_emit_fields:
  - FLD-A
  - FLD-B
  - FLD-C
  - FLD-D
  - FLD-E
  - FLD-F
note: >-
  Cloud IdP sign-in and audit logs. Higher regime: emit FLD-E (originating
  device/session id) and keep user.id/host.id stable across re-identification
  per §22(4). Worked example of adding a new log source — see CONTRIBUTING.md.
